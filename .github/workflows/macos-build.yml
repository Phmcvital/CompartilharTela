name: Build PIT macOS (.app & .dmg)

on:
  push:
    branches:
      - mac
      - "feat/macos*"
  pull_request:
    branches:
      - master
      - ui
      - mac
  workflow_dispatch:

jobs:
  build-macos:
    name: Build Universal macOS App (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (aarch64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Run unit tests (ct-core & ct-media)
        working-directory: rust
        run: cargo test --workspace

      - name: Build Apple Silicon (aarch64-apple-darwin)
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --target aarch64-apple-darwin --bin compartilhador-de-tela

      - name: Build Intel (x86_64-apple-darwin)
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --target x86_64-apple-darwin --bin compartilhador-de-tela

      - name: Create Universal Binary with lipo & package PIT.app / .dmg
        working-directory: rust
        run: |
          mkdir -p target/universal-macos
          lipo -create \
            target/aarch64-apple-darwin/release/compartilhador-de-tela \
            target/x86_64-apple-darwin/release/compartilhador-de-tela \
            -output target/universal-macos/compartilhador-de-tela
          file target/universal-macos/compartilhador-de-tela
          chmod +x macos/bundle_macos.sh
          ./macos/bundle_macos.sh target/universal-macos/compartilhador-de-tela

      - name: Upload PIT-macOS-Universal (.dmg & .zip) artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIT-macOS-Universal
          path: |
            rust/target/macos-bundle/PIT-macOS-Universal.dmg
            rust/target/macos-bundle/PIT-macOS-Universal.zip
          if-no-files-found: error
          retention-days: 30
